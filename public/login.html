<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Painel de Revenda</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
  :root {
    --bg: #0B0F14; --surface: #131A22; --border: #232C37;
    --text: #E6EDF3; --text-muted: #7C8798;
    --ok: #34D399; --danger: #F87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: 'Inter', sans-serif;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 20px;
  }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 32px; max-width: 380px; width: 100%;
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif; font-size: 22px;
    margin: 0 0 4px; display: flex; align-items: center; gap: 8px;
  }
  .signal-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .sub { color: var(--text-muted); font-size: 13px; margin-bottom: 24px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
  .field input {
    width: 100%; background: #1B232D; border: 1px solid var(--border);
    border-radius: 8px; padding: 11px 12px; color: var(--text);
    font-family: 'Inter', sans-serif; font-size: 14px; box-sizing: border-box;
  }
  button {
    width: 100%; margin-top: 8px; padding: 13px; border-radius: 10px;
    border: none; background: var(--ok); color: #06231A;
    font-weight: 600; font-size: 14px; cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  .erro {
    color: var(--danger); font-size: 13px; margin-top: 12px;
    display: none;
  }
</style>
</head>
<body>

<div class="card">
  <h1><span class="signal-dot"></span> Painel de Revenda</h1>
  <div class="sub">Entra com o e-mail e senha da sua conta</div>

  <div class="field">
    <label>E-mail</label>
    <input type="email" id="input-email" placeholder="seuemail@exemplo.com">
  </div>
  <div class="field" id="campo-senha-login">
    <label>Senha</label>
    <input type="password" id="input-senha" placeholder="••••••••">
    <div style="text-align:right; margin-top:6px;">
      <a href="javascript:void(0)" onclick="mostrarRecuperarSenha()" style="font-size:12px; color:var(--text-muted);">Esqueci minha senha</a>
    </div>
  </div>

  <button id="btn-entrar" onclick="fazerLogin()">Entrar</button>
  <div class="erro" id="erro-login"></div>

  <div id="bloco-recuperar-senha" style="display:none; margin-top:20px; padding-top:20px; border-top:1px solid var(--border);">
    <div class="sub" style="margin-bottom:12px;">Digite seu e-mail que a gente manda um link pra você criar uma senha nova.</div>
    <button id="btn-recuperar" onclick="enviarRecuperacaoSenha()" style="background:var(--surface-2); color:var(--text); border:1px solid var(--border);">Enviar link de recuperação</button>
    <div style="text-align:center; margin-top:10px;">
      <a href="javascript:void(0)" onclick="esconderRecuperarSenha()" style="font-size:12px; color:var(--text-muted);">Voltar pro login</a>
    </div>
    <div class="erro" id="erro-recuperacao" style="display:none;"></div>
    <div id="sucesso-recuperacao" style="display:none; color:var(--ok); font-size:13px; margin-top:12px; text-align:center;"></div>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyD_hPyEcvWiJ_XqwwbeDvFkUYWL2Rdk-5Y",
    authDomain: "gestor-revenda-a0e61.firebaseapp.com",
    databaseURL: "https://gestor-revenda-a0e61-default-rtdb.firebaseio.com",
    projectId: "gestor-revenda-a0e61",
    storageBucket: "gestor-revenda-a0e61.firebasestorage.app",
    messagingSenderId: "1026444053849",
    appId: "1:1026444053849:web:4590233bd375d70a139048"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  // Se já estiver logado, pula direto pro painel
  auth.onAuthStateChanged((user) => {
    if (user) window.location.href = '/painel.html';
  });

  function mostrarRecuperarSenha() {
    document.getElementById('campo-senha-login').style.display = 'none';
    document.getElementById('btn-entrar').style.display = 'none';
    document.getElementById('erro-login').style.display = 'none';
    document.getElementById('bloco-recuperar-senha').style.display = 'block';
    document.getElementById('erro-recuperacao').style.display = 'none';
    document.getElementById('sucesso-recuperacao').style.display = 'none';
  }
  function esconderRecuperarSenha() {
    document.getElementById('campo-senha-login').style.display = 'block';
    document.getElementById('btn-entrar').style.display = 'block';
    document.getElementById('bloco-recuperar-senha').style.display = 'none';
  }
  async function enviarRecuperacaoSenha() {
    const email = document.getElementById('input-email').value.trim();
    const erroEl = document.getElementById('erro-recuperacao');
    const sucessoEl = document.getElementById('sucesso-recuperacao');
    const btn = document.getElementById('btn-recuperar');

    erroEl.style.display = 'none';
    sucessoEl.style.display = 'none';

    if (!email) {
      erroEl.textContent = 'Preenche o e-mail no campo acima primeiro.';
      erroEl.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Enviando...';

    try {
      await auth.sendPasswordResetEmail(email);
      sucessoEl.textContent = '✅ Link enviado! Confere sua caixa de entrada (e o spam).';
      sucessoEl.style.display = 'block';
    } catch (err) {
      // Por segurança, não revela se o e-mail existe ou não
      sucessoEl.textContent = '✅ Se esse e-mail estiver cadastrado, o link de recuperação foi enviado.';
      sucessoEl.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Enviar link de recuperação';
    }
  }

  async function fazerLogin() {
    const email = document.getElementById('input-email').value.trim();
    const senha = document.getElementById('input-senha').value;
    const erroEl = document.getElementById('erro-login');
    const btn = document.getElementById('btn-entrar');

    erroEl.style.display = 'none';

    if (!email || !senha) {
      erroEl.textContent = 'Preenche e-mail e senha.';
      erroEl.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Entrando...';

    try {
      await auth.signInWithEmailAndPassword(email, senha);
      window.location.href = '/painel.html';
    } catch (err) {
      let mensagem = 'Não deu pra entrar. Confirma o e-mail e a senha.';
      if (err.code === 'auth/invalid-email') mensagem = 'E-mail inválido.';
      if (err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') {
        mensagem = 'E-mail ou senha incorretos.';
      }
      erroEl.textContent = mensagem;
      erroEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Entrar';
    }
  }

  document.getElementById('input-senha').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') fazerLogin();
  });
</script>

</body>
</html>
