<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro — Painel de Revenda</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
  :root {
    --bg: #0B0F14; --surface: #131A22; --border: #232C37;
    --text: #E6EDF3; --text-muted: #7C8798;
    --ok: #34D399; --danger: #F87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: 'Inter', sans-serif;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 20px;
  }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 32px; max-width: 380px; width: 100%;
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif; font-size: 22px;
    margin: 0 0 4px; display: flex; align-items: center; gap: 8px;
  }
  .signal-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .sub { color: var(--text-muted); font-size: 13px; margin-bottom: 20px; }
  .indicado-por {
    background: rgba(52,211,153,0.12); border: 1px solid rgba(52,211,153,0.35);
    border-radius: 8px; padding: 10px 12px; font-size: 12px; color: var(--ok);
    margin-bottom: 20px; display: none;
  }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
  .field input {
    width: 100%; background: #1B232D; border: 1px solid var(--border);
    border-radius: 8px; padding: 11px 12px; color: var(--text);
    font-family: 'Inter', sans-serif; font-size: 14px; box-sizing: border-box;
  }
  button {
    width: 100%; margin-top: 8px; padding: 13px; border-radius: 10px;
    border: none; background: var(--ok); color: #06231A;
    font-weight: 600; font-size: 14px; cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  .erro { color: var(--danger); font-size: 13px; margin-top: 12px; display: none; }
  .login-link { text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 16px; }
  .login-link a { color: var(--ok); }
</style>
</head>
<body>

<div class="card">
  <h1><span class="signal-dot"></span> Criar conta</h1>
  <div class="sub">Cadastra sua conta de revendedor</div>
  <div class="indicado-por" id="indicado-por-aviso"></div>

  <div class="field">
    <label>Seu nome</label>
    <input type="text" id="input-nome" placeholder="Nome completo">
  </div>
  <div class="field">
    <label>E-mail</label>
    <input type="email" id="input-email" placeholder="seuemail@exemplo.com">
  </div>
  <div class="field">
    <label>Senha (mínimo 6 caracteres)</label>
    <input type="password" id="input-senha" placeholder="••••••••">
  </div>

  <button id="btn-criar" onclick="criarConta()">Criar minha conta</button>
  <div class="erro" id="erro-cadastro"></div>
  <div class="login-link">Já tem conta? <a href="/login.html">Entrar</a></div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyD_hPyEcvWiJ_XqwwbeDvFkUYWL2Rdk-5Y",
    authDomain: "gestor-revenda-a0e61.firebaseapp.com",
    databaseURL: "https://gestor-revenda-a0e61-default-rtdb.firebaseio.com",
    projectId: "gestor-revenda-a0e61",
    storageBucket: "gestor-revenda-a0e61.firebasestorage.app",
    messagingSenderId: "1026444053849",
    appId: "1:1026444053849:web:4590233bd375d70a139048"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const FIREBASE_DB = firebaseConfig.databaseURL;

  const params = new URLSearchParams(window.location.search);
  const refUid = params.get('ref');
  let nomeIndicador = '';

  async function carregarIndicador() {
    if (!refUid) return;
    try {
      const res = await fetch(`${FIREBASE_DB}/revendedores/${refUid}/nome.json`);
      nomeIndicador = await res.json();
      if (nomeIndicador) {
        const aviso = document.getElementById('indicado-por-aviso');
        aviso.textContent = `🎉 Você está entrando pelo convite de ${nomeIndicador}`;
        aviso.style.display = 'block';
      }
    } catch (err) {}
  }
  carregarIndicador();

  async function criarConta() {
    const nome = document.getElementById('input-nome').value.trim();
    const email = document.getElementById('input-email').value.trim();
    const senha = document.getElementById('input-senha').value;
    const erroEl = document.getElementById('erro-cadastro');
    const btn = document.getElementById('btn-criar');

    erroEl.style.display = 'none';

    if (!nome || !email || !senha) {
      erroEl.textContent = 'Preenche todos os campos.';
      erroEl.style.display = 'block';
      return;
    }
    if (senha.length < 6) {
      erroEl.textContent = 'A senha precisa ter pelo menos 6 caracteres.';
      erroEl.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Criando...';

    try {
      const cred = await auth.createUserWithEmailAndPassword(email, senha);
      const uid = cred.user.uid;

      const testeHorasRes = await fetch(`${FIREBASE_DB}/configPlataforma/testeHoras.json`);
      const testeHoras = (await testeHorasRes.json()) || 48;

      await fetch(`${FIREBASE_DB}/revendedores/${uid}.json`, {
        method: 'PUT',
        body: JSON.stringify({
          nome,
          email,
          criadoEm: Date.now(),
          ativo: true,
          assinaturaStatus: 'teste',
          testeAte: Date.now() + testeHoras * 60 * 60 * 1000,
          indicadoPor: refUid || null
        })
      });

      window.location.href = '/index.html';
    } catch (err) {
      let mensagem = 'Não deu pra criar a conta.';
      if (err.code === 'auth/email-already-in-use') mensagem = 'Já existe uma conta com esse e-mail.';
      if (err.code === 'auth/invalid-email') mensagem = 'E-mail inválido.';
      if (err.code === 'auth/weak-password') mensagem = 'Senha muito fraca.';
      erroEl.textContent = mensagem;
      erroEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Criar minha conta';
    }
  }
</script>

</body>
</html>
